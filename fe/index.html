<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fruitables - Nông Sản Hữu Cơ Tươi Sạch</title>
    <meta content="web ban do an, nong san huu co, trai cay tuoi sach" name="keywords">
    <meta content="Cửa hàng nông sản hữu cơ Fruitables - rau củ quả tươi sạch VietGAP" name="description">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Raleway:wght@600;800&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="lib/lightbox/css/lightbox.min.css" rel="stylesheet">
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="css/style.css" rel="stylesheet">

    <!-- Style bổ sung cho slider sản phẩm trang chủ -->
    <style>
        .product-slider-wrapper {
            position: relative;
            padding: 0 45px;
        }

        .productSwiper .swiper-button-next,
        .productSwiper .swiper-button-prev {
            z-index: 99 !important;
            width: 40px;
            height: 40px;
            background: #ffffff;
            border: 2px solid #81c408;
            border-radius: 50%;
            color: #81c408 !important;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .productSwiper .swiper-button-next:after,
        .productSwiper .swiper-button-prev:after {
            font-size: 16px !important;
            font-weight: bold;
        }

        .productSwiper .swiper-button-prev {
            left: 0px !important;
        }

        .productSwiper .swiper-button-next {
            right: 0px !important;
        }

        .product-desc-short {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            min-height: 38px;
        }

        .fruite-item {
            transition: all 0.3s ease;
            background: #fff;
        }

        .fruite-item:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <!-- JavaScript Libraries (Bootstrap dùng cho dropdown/collapse/carousel) -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
