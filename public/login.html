<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <title>Đăng Nhập & Đăng Ký - Organic Menu</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Raleway:wght@600;800&display=swap" rel="stylesheet"> 

    <!-- Icon Font Stylesheet -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="css/style.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f8;
            font-family: 'Open Sans', sans-serif;
        }
        .auth-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            background: #ffffff;
            overflow: hidden;
        }
        .auth-header {
            background: linear-gradient(135deg, #81c408 0%, #5d8e05 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        .nav-pills .nav-link {
            color: #6c757d;
            font-weight: 600;
            border-radius: 30px;
            padding: 10px 25px;
        }
        .nav-pills .nav-link.active {
            background-color: #81c408 !important;
            color: #ffffff !important;
        }
        .form-control:focus {
            border-color: #81c408;
            box-shadow: 0 0 0 0.25rem rgba(129, 196, 8, 0.25);
        }
        .btn-organic {
            background-color: #81c408;
            color: white;
            font-weight: 600;
            border-radius: 30px;
            padding: 12px;
            transition: all 0.3s ease;
        }
        .btn-organic:hover {
            background-color: #5d8e05;
            color: white;
            transform: translateY(-2px);
        }
        .brand-title {
            font-family: 'Raleway', sans-serif;
            font-weight: 800;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="auth-card">
                    
                    <!-- Header xanh chủ đạo -->
                    <div class="auth-header">
                        <a href="index.html" class="text-decoration-none">
                            <h1 class="text-white brand-title m-0">Fruitables</h1>
                        </a>
                        <p class="text-white-50 m-0 mt-1">Thực phẩm hữu cơ & Thực đơn thông minh</p>
                    </div>

                    <div class="p-4 p-sm-5">
                        <!-- Navigation Tabs: Đăng Nhập / Đăng Ký -->
                        <ul class="nav nav-pills nav-justified mb-4" id="pills-tab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="pills-login-tab" data-bs-toggle="pill" data-bs-target="#pills-login" type="button" role="tab">Đăng Nhập</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="pills-register-tab" data-bs-toggle="pill" data-bs-target="#pills-register" type="button" role="tab">Đăng Ký</button>
                            </li>
                        </ul>

                        <div class="tab-content" id="pills-tabContent">
                            
                            <!-- TAB 1: FORM ĐĂNG NHẬP -->
                            <div class="tab-pane fade show active" id="pills-login" role="tabpanel">
                                <form id="loginForm">
                                    <div class="mb-3">
                                        <label class="form-label text-dark fw-semibold">Địa chỉ Email</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light text-primary"><i class="fas fa-envelope"></i></span>
                                            <input type="email" id="login-email" class="form-control" placeholder="admin@gmail.com hoặc khach@gmail.com" required>
                                        </div>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label text-dark fw-semibold">Mật khẩu</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light text-primary"><i class="fas fa-lock"></i></span>
                                            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-organic w-100 mb-3">
                                        <i class="fas fa-sign-in-alt me-2"></i>ĐĂNG NHẬP
                                    </button>
                                </form>
                            </div>

                            <!-- TAB 2: FORM ĐĂNG KÝ -->
                            <div class="tab-pane fade" id="pills-register" role="tabpanel">
                                <form id="registerForm">
                                    <div class="mb-3">
                                        <label class="form-label text-dark fw-semibold">Họ và Tên</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light text-primary"><i class="fas fa-user"></i></span>
                                            <input type="text" id="reg-name" class="form-control" placeholder="Nguyễn Văn A" required>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label text-dark fw-semibold">Email</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light text-primary"><i class="fas fa-envelope"></i></span>
                                            <input type="email" id="reg-email" class="form-control" placeholder="example@gmail.com" required>
                                        </div>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label text-dark fw-semibold">Mật khẩu</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light text-primary"><i class="fas fa-lock"></i></span>
                                            <input type="password" id="reg-password" class="form-control" placeholder="Tối thiểu 6 ký tự" required>
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-organic w-100 mb-3">
                                        <i class="fas fa-user-plus me-2"></i>TẠO TÀI KHOẢN
                                    </button>
                                </form>
                            </div>

                        </div>

                        <!-- Quay lại trang chủ -->
                        <div class="text-center mt-4 pt-3 border-top">
                            <a href="index.html" class="text-decoration-none text-muted fw-semibold">
                                <i class="fas fa-arrow-left me-1 text-primary"></i> Quay lại trang chủ
                            </a>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Libraries -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script Xử Lý Đăng Nhập -->
    <script>
        // Nếu đã đăng nhập rồi mà cố tình truy cập login.html -> Đẩy về trang tương ứng ngay lập tức
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (currentUser) {
            if (currentUser.vai_tro === 'admin') {
                window.location.href = '/admin.html';
            } else {
                window.location.href = '/index.html';
            }
        }
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const mat_khau = document.getElementById('login-password').value;

            fetch('/api/dang-nhap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, mat_khau })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    // Lưu thông tin người dùng vào LocalStorage
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    
                    alert('✅ Đăng nhập thành công!');
                    
                    // Chuyển hướng tự động (Admin -> admin.html, Khách -> index.html)
                    window.location.href = data.redirectUrl;
                } else {
                    alert('❌ ' + data.message);
                }
            })
            .catch(err => {
                console.error('Lỗi đăng nhập:', err);
                alert('Không thể kết nối đến máy chủ!');
            });
        });
    </script>

</body>

</html>
